<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporada 2027 - Liga Will Sports</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/classificacao.css">
    <link rel="stylesheet" href="styles/calendario2027.css">
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            Voltar
        </a>
        <span class="topbar-title">Temporada 2027</span>
        <img src="Images/Logo wil.svg" alt="LWS" class="topbar-logo">
    </div>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="Images/Logo wil.svg" alt="Liga Will Sports" class="logo">
            </div>
            <h1>Temporada 2027</h1>
            <div class="subtitle">Prévia das divisões e do calendário</div>
        </div>

        <div class="preview-notice">
            ⚠️ Prévia: equipes e confrontos são <strong>provisórios</strong> e podem mudar até o início da temporada.
        </div>

        <div class="season-summary" id="seasonSummary"></div>

        <h2 class="section-title">Divisões</h2>
        <div class="divisions-grid" id="divisionsGrid"></div>

        <h2 class="section-title">Calendário</h2>
        <div class="team-filter">
            <label for="teamFilter">Ver jogos de uma equipe</label>
            <select id="teamFilter"></select>
        </div>

        <div class="rounds-nav" id="roundTabs"></div>
        <div id="roundsContainer"></div>

        <div class="footer" id="calendarNote"></div>
    </div>

    <script src="js/data-loader.js"></script>
    <script src="js/calendario2027-page.js"></script>
</body>
</html>
